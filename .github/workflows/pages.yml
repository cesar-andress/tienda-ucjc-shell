# Publica el shell estático en GitHub Pages (Actions).
# Requisito: Settings → Pages → Source: GitHub Actions
# (el site ya existe; no usar enablement — el token de Actions no puede crearlo).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar sitio
        run: |
          mkdir _site
          cp index.html manifest.json .nojekyll _site/
          cp -r relleno _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
