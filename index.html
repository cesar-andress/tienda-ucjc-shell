<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCJC Store</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #111; background: #fafafa; }
    body { margin: 0; }
    header {
      padding: 1rem 1.5rem; border-bottom: 1px solid #ddd; background: #fff;
      display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header small { color: #666; }
    main {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
      padding: 1rem 1.5rem; max-width: 1200px; margin: 0 auto;
    }
    section {
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      padding: 1rem; min-height: 8rem;
    }
    section > h2 {
      margin: 0 0 .5rem; font-size: .8rem; text-transform: uppercase;
      letter-spacing: .05em; color: #666; display: flex; justify-content: space-between; gap: .5rem;
    }
    section > h2 span { font-weight: normal; }
    .unavailable { color: #a33; margin: 0; }
    footer { padding: 1rem 1.5rem; font-size: .8rem; color: #666; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>UCJC Store</h1>
    <small id="status">loading manifest…</small>
  </header>
  <main>
    <section id="identidad">
      <h2>Identity <span></span></h2>
      <div class="slot"></div>
    </section>
    <section id="descubrimiento">
      <h2>Discovery <span></span></h2>
      <div class="slot"></div>
    </section>
    <section id="compra">
      <h2>Purchase <span></span></h2>
      <div class="slot"></div>
    </section>
    <section id="datos">
      <h2>Data · My orders <span></span></h2>
      <div class="slot"></div>
    </section>
  </main>
  <footer>
    Integration shell. It only loads tagged releases listed in
    <code>manifest.json</code>. Pieces talk only through
    <code>CustomEvent</code> on <code>window</code>.
  </footer>
  <script type="module">
    const ELEMENT = {
      identidad: 'ucjc-identidad',
      descubrimiento: 'ucjc-descubrimiento',
      compra: 'ucjc-compra',
      datos: 'ucjc-pedidos',
    };

    // Week 1: each entry carries its own url.
    // From Friday 30 Oct (uncertainty 1): { base, piezas } and the shell builds
    // `${base}/tienda-ucjc-${piece}/v${version}/remote.js`
    function resolveEntries(manifest) {
      if (manifest.piezas) {
        return Object.entries(manifest.piezas).map(([piece, version]) => {
          const base = typeof manifest.base === 'string'
            ? manifest.base
            : (manifest.base && manifest.base[piece]);
          if (!base) throw new Error(`missing base for piece "${piece}"`);
          return [piece, {
            version,
            url: `${base.replace(/\/$/, '')}/tienda-ucjc-${piece}/v${version}/remote.js`,
          }];
        });
      }
      return Object.entries(manifest);
    }

    // Log every ucjc:* event so the class can see the contracts fire.
    const originalDispatch = EventTarget.prototype.dispatchEvent;
    EventTarget.prototype.dispatchEvent = function (event) {
      if (event && typeof event.type === 'string' && event.type.startsWith('ucjc:')) {
        console.log('[ucjc event]', event.type, event.detail);
      }
      return originalDispatch.call(this, event);
    };

    const manifest = await (await fetch('./manifest.json', { cache: 'no-store' })).json();
    const entries = resolveEntries(manifest);
    document.getElementById('status').textContent =
      `manifest: ${entries.map(([p, { version }]) => `${p}@${version}`).join(' · ')}`;

    for (const [piece, { version, url }] of entries) {
      const section = document.getElementById(piece);
      const label = section.querySelector('h2 span');
      const slot = section.querySelector('.slot');
      try {
        const mod = await import(url);
        const tag = ELEMENT[piece];
        if (!tag) throw new Error(`unknown piece "${piece}"`);
        if (!customElements.get(tag)) {
          throw new Error(`module did not register <${tag}>`);
        }
        slot.replaceChildren(document.createElement(tag));
        label.textContent = `v${version}`;
        console.info(`[shell] ${piece} v${version} loaded`, mod.default);
      } catch (err) {
        slot.innerHTML = `<p class="unavailable">${piece}: piece unavailable</p>`;
        label.textContent = `v${version} · error`;
        console.error(`[shell] ${piece} v${version} failed from ${url}`, err);
      }
    }
  </script>
</body>
</html>
